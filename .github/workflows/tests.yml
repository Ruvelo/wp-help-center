name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: WordPress security, database and i18n rules (PHPCS)
        run: vendor/bin/phpcs

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wordpress: ['7.0', 'latest']

    name: PHP ${{ matrix.php }} · WordPress ${{ matrix.wordpress }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom, zip
          coverage: none
          tools: composer:v2

      - name: Download WordPress ${{ matrix.wordpress }}
        run: |
          if [ "${{ matrix.wordpress }}" = "latest" ]; then url=https://wordpress.org/latest.tar.gz; else url=https://wordpress.org/wordpress-${{ matrix.wordpress }}.tar.gz; fi
          mkdir -p /tmp && curl -sSL "$url" | tar xz -C /tmp

      - name: Install dependencies
        run: |
          if [ "${{ matrix.wordpress }}" != "latest" ]; then composer require --dev "wp-phpunit/wp-phpunit:${{ matrix.wordpress }}.*" --no-update; fi
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Build the plugin
        run: bash bin/build-zip.sh

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/ruvelo-help-center
